- version: 2
  port_limit: 2
  interfaces: ['86:00.0', '86:00.1']
  port_bandwidth_gb: 10
  # TRex v3.05+ (DPDK 24.03) selects an i40e AVX2 receive function that it
  # builds as a stub, so X710/XXV710 ports stop receiving once their RX ring
  # fills. Limiting DPDK to 128-bit SIMD selects the working SSE path; drop
  # this once TRex fixes it. See
  # https://github.com/cisco-system-traffic-generator/trex-core/issues/1182
  ext_dpdk_opt: ["--force-max-simd-bitwidth=128"]
  c: 2
  port_info:
    - src_mac: 40:a6:b7:20:c8:24
      dest_mac: 40:a6:b7:20:4f:b8
    - src_mac: 40:a6:b7:20:c8:25
      dest_mac: 40:a6:b7:20:4f:b9
  memory:
    mbuf_64: 4096
    mbuf_128: 512
    mbuf_256: 256
    mbuf_512: 128
    mbuf_1024: 256
    mbuf_2048: 128
    traffic_mbuf_64: 4096
    traffic_mbuf_128: 512
    traffic_mbuf_256: 256
    traffic_mbuf_512: 128
    traffic_mbuf_1024: 256
    traffic_mbuf_2048: 128
    dp_flows: 4096
  platform:
    master_thread_id: 10
    rx_thread_id: 11 # replaces latency_thread_id
    dual_if:
      - socket: 0
        threads: [12, 13]
