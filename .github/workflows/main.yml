name: CI Pipeline
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  clang-format:
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        path:
          - check: 'core'
            exclude: '(kmod)' # Exclude "kmod" dir because of different format
          - check: 'protobuf'
            exclude: '' # Nothing to exclude
          - check: 'sample_plugin/modules'
            exclude: '' # Nothing to exclude
          - check: 'sample_plugin/protobuf'
            exclude: '' # Nothing to exclude
    uses: omec-project/.github/.github/workflows/check-clang-format.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}
      clang_format_version: '14'
      check_path: ${{ matrix.path['check'] }}
      exclude_regex: ${{ matrix.path['exclude'] }}
  check-spelling:
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/check-spelling.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}
  hadolint:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/hadolint.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}
      dockerfile: env/Dockerfile
  license-check:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/license-check.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}
  fossa-scan:
    permissions:
      contents: read
      security-events: write
      id-token: write
      attestations: write
    uses: omec-project/.github/.github/workflows/fossa-scan.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}
  analysis:
    if: github.repository_owner == 'omec-project'
    permissions:
      actions: read
      artifact-metadata: read
      attestations: read
      checks: read
      code-quality: read
      contents: read
      deployments: read
      discussions: read
      drives: read
      id-token: write
      issues: read
      models: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: write
      statuses: read
      vulnerability-alerts: read
    uses: omec-project/.github/.github/workflows/scorecard-analysis.yml@c6f69e74f8ee9034dcc237ccbd719de59526aee5 # v0.0.30
    with:
      branch_name: ${{ github.ref }}
