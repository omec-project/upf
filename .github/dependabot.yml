# Timeline for each ecosystem is intentionally staggered to spread
# Dependabot PRs over the week.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "21:00"
      timezone: "America/Los_Angeles"
  - package-ecosystem: "docker"
    directory: "/ptf"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "21:00"
      timezone: "America/Los_Angeles"
  - package-ecosystem: "docker"
    directory: "/bess/env"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "21:00"
      timezone: "America/Los_Angeles"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "21:00"
      timezone: "America/Los_Angeles"
    groups:
      omec-project:
        patterns:
          - "github.com/omec-project/*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "21:00"
      timezone: "America/Los_Angeles"
    groups:
      # Scapy gets its own PR: the TRex client patch
      # ptf/patches/trex/0004-stl-calculate-scapy-offsets.patch relies on how
      # Scapy parses fields, and the PTF dependency smoke check tests it.
      # Dependabot puts a dependency in the first group it matches, and the
      # exact pattern leaves scapy-helper in python-deps.
      scapy:
        patterns:
          - "scapy"
      python-deps:
        patterns:
          - "*"
    ignore:
      # pyperclip and tabulate are transitively required by PTF through
      # scapy-helper, whose latest release pins pyperclip==1.8.2 and
      # tabulate~=0.8.7. Updating either independently makes
      # ptf/requirements-ptf.txt unsatisfiable; revisit with the PTF lockfile
      # generation workflow.
      - dependency-name: "pyperclip"
      - dependency-name: "tabulate"
  - package-ecosystem: "pip"
    directory: "/bess/env"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "21:00"
      timezone: "America/Los_Angeles"
    groups:
      bess-python-deps:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "21:00"
      timezone: "America/Los_Angeles"
    groups:
      actions-deps:
        patterns:
          - "*"
